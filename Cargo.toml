[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Local crates
datafusion-app = { path = "crates/datafusion-app" }
datafusion-auth = { path = "crates/datafusion-auth" }
datafusion-functions-arrow = { path = "crates/datafusion-functions-arrow" }
datafusion-functions-parquet = { path = "crates/datafusion-functions-parquet" }
datafusion-functions-rocksdb = { path = "crates/datafusion-functions-rocksdb" }
datafusion-net = { path = "crates/datafusion-net" }
datafusion-udfs-wasm = { path = "crates/datafusion-udfs-wasm" }
