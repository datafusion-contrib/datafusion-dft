[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2021"

[workspace.dependencies]
### Local
datafusion-app = { path = "crates/datafusion-app" }
datafusion-functions-arrow = { path = "crates/datafusion-functions-arrow" }
datafusion-functions-parquet = { path = "crates/datafusion-functions-parquet" }
datafusion-functions-rocksdb = { path = "crates/datafusion-functions-rocksdb" }
datafusion-net = { path = "crates/datafusion-net" }
datafusion-udfs-wasm = { path = "crates/datafusion-udfs-wasm" }
###

arrow = "59"
arrow-flight = "59"
assert_cmd = "2.0.16"
async-trait = "0.1.80"
axum = "0.7.9"
base64 = "0.22.1"
bytes = "1"
clap = { features = ["derive"], version = "4.5.27" }
color-eyre = "0.6.3"
criterion = "0.5.1"
crossterm = "0.29"
datafusion = "55"
datafusion-functions-json = "0.55"
deltalake = "1.1"
directories = "5.0.1"
dns-lookup = "3"
env_logger = "0.11.5"
etherparse = "0.20"
flatbuffers = { default-features = false, version = "25.2.10" }
futures = "0.3.30"
http = "1"
http-body = "1"
http-body-util = "0.1.3"
indexmap = "2.8.0"
indicatif = "0.17"
insta = "1.40.0"
itertools = "0.13.0"
jiff = "0.2.5"
lazy_static = "1.4.0"
log = "0.4.22"
maxminddb = "0.29"
metrics = "0.24.0"
metrics-exporter-prometheus = "0.16.0"
num_cpus = "1.16.0"
opendal = "0.58.0"
parquet = { default-features = false, features = ["arrow"], version = "59.2" }
# object_store_opendal 0.59 requires object_store 0.14; DataFusion 55 is still on
# object_store 0.13, so stay on 0.58 until DataFusion moves to object_store 0.14.
object_store = "0.13"
object_store_opendal = "0.58.0"
parking_lot = "0.12.3"
pcap = "2.4"
pcap-parser = "0.17"
pin-project-lite = "0.2.14"
predicates = "3.1.2"
prost = "0.14"
ratatui = "0.30"
ratatui-textarea = "0.8"
reqwest = "0.12.23"
rocksdb = "0.25"
rustls = { default-features = false, features = [
  "aws-lc-rs",
], version = "0.23" }
serde = { features = ["derive"], version = "1.0.197" }
serde_json = "1.0.140"
socket2 = "0.5"
strum = { features = ["derive"], version = "0.26.2" }
tempfile = "3.2.0"
tokio = { features = ["macros", "rt"], version = "1.36.0" }
tokio-metrics = "0.4"
tokio-stream = "0.1.15"
tokio-tungstenite = "0.29"
tokio-util = "0.7.10"
toml = "0.8.12"
tonic = "0.14"
tower = "0.5.0"
tower-http = "0.6.2"
tpchgen = "3.0"
tpchgen-arrow = "3.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tui-logger = "0.18"
url = { features = ["serde"], version = "2.5.2" }
uuid = "1.10.0"
vortex = "0.86"
vortex-btrblocks = "0.86"
vortex-datafusion = "0.86"
vortex-file = "0.86"
vortex-session = "0.86"
wasi-common = "29.0.1"
wasmtime = "29.0.1"

[profile.bench]
debug = true

# The `clickhouse` and `mongodb` features are temporarily disabled because
# `datafusion-table-providers` has no DataFusion 55 release yet. The gated test helpers
# remain in the tree; these cfg values are declared so they do not warn.
# TODO: remove this once datafusion-table-providers supports DataFusion 55 and the
# `clickhouse`/`mongodb` features are restored.
[workspace.lints.rust]
unexpected_cfgs = { check-cfg = [
  'cfg(feature, values("clickhouse", "mongodb"))',
], level = "allow" }

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
