    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: LSIAQAAAAAAVNCBMPNSG
          RUSTFS_SECRET_KEY: "5555555555555555555555555555555555555555"
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@v3
