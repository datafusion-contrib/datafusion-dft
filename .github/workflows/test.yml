          restore-keys: |
            target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            target-${{ runner.os }}-
      - name: Setup Rust Toolchain
        uses: ./.github/actions/setup-rust
      # The tests seed data with `docker exec mongodb mongosh`, which requires a container
      # named `mongodb`, so a service container (with a generated name) is not used here
      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=admin -e MONGO_INITDB_ROOT_PASSWORD=secret \
            mongo:7.0
      - name: Wait for MongoDB
        run: |
          timeout 60 bash -c 'until docker exec mongodb mongosh -u admin -p secret --authenticationDatabase admin --quiet --eval "db.adminCommand({ ping: 1 })"; do sleep 2; done'
      - name: Run MongoDB tests
        run: |
          cargo test --features=mongodb extension_cases::mongodb
