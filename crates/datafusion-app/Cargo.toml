[package]
edition.workspace = true
name = "datafusion-app"
version = "0.1.1"

# Leaving Hudi and Iceberg around in case traction on those picks up.  
# It would be better if I just remove them from main and create PRs with the diff - 
# maybe ill get around to that.

[dependencies]
### Local
datafusion-functions-arrow = { optional = true, workspace = true }
datafusion-functions-parquet = { optional = true, workspace = true }
datafusion-functions-rocksdb = { optional = true, workspace = true }
datafusion-net = { optional = true, workspace = true }
datafusion-udfs-wasm = { features = [
  "serde",
], optional = true, workspace = true }
###

arrow-flight = { features = [
  "flight-sql-experimental",
], optional = true, workspace = true }
async-trait.workspace = true
base64 = { optional = true, workspace = true }
bytes.workspace = true
color-eyre.workspace = true
datafusion.workspace = true
datafusion-functions-json = { optional = true, workspace = true }
deltalake = { features = [
  "datafusion",
  "s3",
], optional = true, workspace = true }
directories.workspace = true
futures.workspace = true
indexmap = { features = ["serde"], workspace = true }
itertools.workspace = true
log.workspace = true
metrics = { optional = true, workspace = true }
num_cpus.workspace = true
object_store = { features = ["aws"], optional = true, workspace = true }
object_store_opendal = { optional = true, workspace = true }
opendal = { features = [
  "services-huggingface",
], optional = true, workspace = true }
parking_lot.workspace = true
prost = { optional = true, workspace = true }
rustls = { optional = true, workspace = true }
serde.workspace = true
tokio = { features = ["rt-multi-thread"], workspace = true }
tokio-metrics = { features = [
  "metrics-rs-integration",
], optional = true, workspace = true }
tokio-stream = { features = ["net"], workspace = true }
tokio-tungstenite = { features = [
  "rustls-tls-native-roots",
], optional = true, workspace = true }
tonic = { optional = true, workspace = true }
url = { optional = true, workspace = true }
vortex-datafusion = { optional = true, workspace = true }

[dev-dependencies]
criterion = { features = ["async_tokio"], workspace = true }

[features]
default = ["functions-parquet"]
deltalake = ["dep:deltalake"]
flightsql = ["dep:arrow-flight", "dep:base64", "dep:prost", "dep:tonic"]
functions-arrow = ["dep:datafusion-functions-arrow"]
functions-json = ["dep:datafusion-functions-json"]
functions-parquet = ["dep:datafusion-functions-parquet"]
functions-rocksdb = ["dep:datafusion-functions-rocksdb"]
huggingface = ["object_store_opendal", "opendal", "url"]
net = ["datafusion-net/live", "dep:datafusion-net"]
observability = ["dep:metrics", "dep:tokio-metrics"]
s3 = ["object_store/aws", "url"]
udfs-wasm = ["dep:datafusion-udfs-wasm"]
vortex = ["dep:vortex-datafusion"]
websocket = ["dep:rustls", "dep:tokio-tungstenite"]

[lints]
workspace = true

[[bench]]
harness = false
name = "map_table_benchmark"
