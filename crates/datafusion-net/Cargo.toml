[package]
authors = ["Matthew Turner <matthew.m.turner@outlook.com>"]
description = "DataFusion table functions for querying network packet captures (pcap)"
edition.workspace = true
homepage = "https://github.com/datafusion-contrib/datafusion-dft/tree/main/crates/datafusion-net"
keywords = ["datafusion", "network", "pcap", "query", "sql"]
license = "Apache-2.0"
name = "datafusion-net"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/datafusion-dft/tree/main/crates/datafusion-net"
version = "0.1.0"

[dependencies]
async-trait.workspace = true
datafusion.workspace = true
dns-lookup.workspace = true
etherparse.workspace = true
maxminddb.workspace = true
pcap = { optional = true, workspace = true }
pcap-parser.workspace = true
tokio = { features = ["sync"], workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { features = ["rt-multi-thread"], workspace = true }

[features]
default = []
live = ["dep:pcap"]

[lints]
workspace = true
