[package]
edition.workspace = true
name = "datafusion-udfs-wasm"
version = "0.1.2"

[dependencies]
datafusion.workspace = true
log.workspace = true
serde = { optional = true, workspace = true }
wasi-common.workspace = true
wasmtime.workspace = true

[dev-dependencies]
criterion = { features = ["html_reports"], workspace = true }
tokio = { features = ["rt-multi-thread"], workspace = true }

[features]
serde = ["dep:serde"]

[lints]
workspace = true

[[bench]]
harness = false
name = "wasm_startup"

[[bench]]
harness = false
name = "row_query_performance"

[[bench]]
harness = false
name = "arrow_ipc_query_performance"
