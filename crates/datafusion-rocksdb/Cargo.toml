[package]
authors = ["Matthew Turner <matthew.m.turner@outlook.com>"]
description = "DataFusion table functions for inspecting RocksDB databases"
edition = "2021"
homepage = "https://github.com/datafusion-contrib/datafusion-dft/tree/main/crates/datafusion-rocksdb"
keywords = ["datafusion", "query", "rocksdb", "sql"]
license = "Apache-2.0"
name = "datafusion-rocksdb"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/datafusion-dft/tree/main/crates/datafusion-rocksdb"
version = "0.1.0"

[dependencies]
arrow = { version = "58" }
async-trait = "0.1.41"
datafusion = { version = "54" }
rocksdb = { version = "0.25" }

[dev-dependencies]
tempfile = "3"
tokio = { features = ["macros", "rt"], version = "1" }
